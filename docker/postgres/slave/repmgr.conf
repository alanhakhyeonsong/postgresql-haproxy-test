# repmgr.conf - Slave Configuration

# Basic settings
node_id=2
node_name='postgres-slave'
conninfo='host=postgres-slave user=repmgr dbname=repmgr connect_timeout=2 password=repmgr_password'
data_directory='/var/lib/postgresql/data'

# Replication settings
replication_user='repmgr'
replication_type='physical'

# Failover settings
failover='automatic'
promote_command='/usr/bin/repmgr standby promote -f /etc/repmgr.conf --log-to-file'
follow_command='/usr/bin/repmgr standby follow -f /etc/repmgr.conf --log-to-file --upstream-node-id=%n'

# Failover settings
# reconnect_attempts(4) x reconnect_interval(6s) = 약 24초 후 장애 확정 후 자동 promote.
# 더 공격적인 값(3x5, monitor 2)은 promote 시점에 PostgreSQL 을 불안정하게 만들어(crash 루프)
# 메타 갱신 실패를 유발하는 것이 검증되어, 안정적인 보수값으로 되돌렸다.
primary_notification_timeout=10
reconnect_attempts=4
reconnect_interval=6

# Monitoring
monitor_interval_secs=5
monitoring_history=yes
connection_check_type='ping'

# Logging
log_level='INFO'
log_facility='STDERR'
log_file='/var/log/repmgr/repmgr.log'
log_status_interval=300

# Service control
service_start_command='pg_ctl -D /var/lib/postgresql/data -l /var/lib/postgresql/data/startup.log start'
service_stop_command='pg_ctl -D /var/lib/postgresql/data stop -m fast'
service_restart_command='pg_ctl -D /var/lib/postgresql/data restart -m fast'
service_reload_command='pg_ctl -D /var/lib/postgresql/data reload'

# SSH settings for witness server (if needed)
ssh_options='-q -o ConnectTimeout=10'

# Node priority (lower number = lower priority for promotion)
priority=90