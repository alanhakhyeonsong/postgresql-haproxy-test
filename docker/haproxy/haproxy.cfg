global
    daemon
    log stdout local0
    stats timeout 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    retries 3
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# HAProxy Statistics
listen stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-node
    stats admin if TRUE

# Main PostgreSQL service with repmgr failover support
# HTTP 헬스체크(:8008)로 현재 primary 를 판정한다. primary 만 200 → write 는 항상 현재 primary 로 라우팅된다.
# repmgrd 가 standby 를 promote 하면 해당 노드의 :8008 이 200 으로 바뀌어 자동으로 write 가 전환된다.
listen postgres-write
    bind *:3000
    mode tcp
    option httpchk GET /
    http-check expect status 200
    balance first
    default-server inter 2s fall 2 rise 1 on-error mark-down
    timeout check 2s

    # 실제 트래픽은 5432(TCP), 헬스 판정은 8008(HTTP). primary 인 노드만 UP 이 된다.
    server postgres-master postgres-master:5432 check port 8008 weight 100 maxconn 100
    server postgres-slave  postgres-slave:5432  check port 8008 weight 100 maxconn 100

# PostgreSQL Read (Load balanced for read operations)
listen postgres-read
    bind *:3001
    mode tcp
    option pgsql-check user ramos
    balance roundrobin
    default-server inter 2s fall 2 rise 2 on-error mark-down
    timeout check 2s
    
    # Both servers available for read operations
    server postgres-master postgres-master:5432 check weight 50 maxconn 50
    server postgres-slave postgres-slave:5432 check weight 100 maxconn 100

# Health check endpoint for monitoring
listen health-check
    bind *:8090
    mode http
    monitor-uri /health
    option httpchk GET /health
    stats enable
    stats uri /status
